
{% load static %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container py-5" style="max-width:600px;">
  <h3 style="color:#c76b8a;">Your Cart ({{ total_items }} items)</h3>
  <hr>
  {% if cart %}
    {% for name, qty in cart.items %}
      <div class="d-flex justify-content-between mb-2 p-2 bg-light rounded">
        <span>{{ name }} x {{ qty }}</span>
        <a href="{% url 'remove_from_cart' name %}" class="btn btn-sm btn-outline-danger">Remove</a>
      </div>
    {% endfor %}
    <div class="mt-4">
      <a href="/flavors/" class="btn" style="background:#c76b8a;color:white;border-radius:20px;">Continue Shopping</a>
      <a href="/checkout/" class="btn btn-success" style="border-radius:20px;">Checkout</a>
    </div>
  {% else %}
    <p>Your cart is empty!</p>
    <a href="/flavors/" class="btn" style="background:#c76b8a;color:white;border-radius:20px;">Go to Flavors</a>
  {% endif %}
</div>
